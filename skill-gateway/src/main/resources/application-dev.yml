# dev：本地真实基础设施（MySQL dev-skill 单库 + Redis + RocketMQ，均为 Docker）
# 端口沿用公共配置 8888（无端口冲突，历史 18080 特例已移除）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/dev-skill?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-skill-platform.sql
