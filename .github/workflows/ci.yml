name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: skill-gateway (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test（local profile，零外部依赖）
        working-directory: skill-gateway
        run: mvn -B test

  billing:
    name: billing-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        working-directory: billing-service
        run: mvn -B test

  recharge:
    name: recharge-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        working-directory: recharge-service
        run: mvn -B test

  worker:
    name: skill-worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: skill-worker
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest tests/ -q

  frontend:
    name: frontend (Vue 3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-console, user-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Test
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm ci || npm install
          npm test
