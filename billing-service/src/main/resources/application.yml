# 公共配置：与环境无关的部分（profile 差异见 application-{local,dev,prod}.yml）
spring:
  application:
    name: billing-service
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null

server:
  port: 8081
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 链路追踪（技术方案 v2.0 §1.7）：默认 none；OTEL_TRACES_EXPORTER=otlp 启用
otel:
  service:
    name: ${OTEL_SERVICE_NAME:billing-service}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
      timeout: 5s
  "traces.sampler": parentbased_traceidratio
  "traces.sampler.arg": ${OTEL_TRACES_SAMPLER_ARG:1.0}

skill-billing:
  internal-token: ${INTERNAL_TOKEN:change-me-internal-token}
  reconcile:
    enabled: true
    cron: "0 */5 * * * ?"
    overdue-hours: 24
  mq:
    # skill-settle 兜底重试消费：local 关闭（Noop），dev/prod 开启（见各 profile 文件）
    enabled: false
    name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
    consumer-group: billing_settle_group
    topic: skill-settle
