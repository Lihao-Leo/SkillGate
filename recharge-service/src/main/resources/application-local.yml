# local：零外部依赖单进程自洽（H2 + Mock 渠道 + 验证码回显）
spring:
  datasource:
    url: jdbc:h2:mem:recharge;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-local.sql
      data-locations: classpath:db/data-local.sql

recharge:
  auth:
    dev-echo-code: true
